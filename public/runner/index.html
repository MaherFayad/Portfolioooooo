<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Maher Runner</title>
  <meta name="description" content="A tiny endless runner starring Maher's pixel avatar. Jump cacti, stomp bugs, dodge meteors." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./embed.css" />
  <link rel="stylesheet" href="./runner.css" />
</head>
<body>
  <main class="page">
    <header class="intro">
      <h1>Outrun the meteors</h1>
      <p class="lede">Jump the cacti, stomp the bugs, watch the sky.</p>
    </header>
  </main>
  <div id="runner"></div>

  <!-- AI chat dock: focusing it makes Maher look down at it -->
  <aside class="chat" id="chat" aria-label="Chat with Maher's agent" data-ai-chat>
    <div class="thread" id="thread" role="log" aria-live="polite"></div>
    <form class="composer" id="composer" autocomplete="off">
      <label class="sr-only" for="ask">Message</label>
      <input id="ask" name="ask" type="text" placeholder="Ask about my work or availability" maxlength="400" />
      <button class="send" type="submit" aria-label="Send message"><i data-lucide="arrow-up" aria-hidden="true"></i></button>
    </form>
  </aside>

  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script type="module">
    import { mountRunner } from './embed.js';
    import { mountThinkingRunner } from './mini.js';

    window.lucide?.createIcons();
    const params = new URLSearchParams(location.search);
    const game = await mountRunner(document.getElementById('runner'), {
      seed: params.has('seed') ? +params.get('seed') : undefined,
      autoplay: params.has('autoplay'),
    });
    window.__runner = game; // for testing in the console
    if (params.has('autoplay')) game.start();

    const ask = document.getElementById('ask');
    const thread = document.getElementById('thread');
    const replies = [
      'I design product experiences end to end: research, flows, UI and design systems. Recent work includes LFG and Sanarte.',
      'Discovery comes first: interviews, analytics and a clear problem statement. Then flows and prototypes, tested with real users.',
      'Yes, I am taking on new projects. The contact page is the fastest way to reach me.',
    ];
    let n = 0;
    document.getElementById('composer').addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = ask.value.trim();
      if (!text) return;
      ask.value = '';
      addMsg('user', text);
      const bubble = addMsg('agent', '');
      const stop = await mountThinkingRunner(bubble, { label: 'Thinking' });
      await new Promise((r) => setTimeout(r, params.has('slowreply') ? 600000 : 3200 + Math.random() * 1500));
      stop();
      bubble.textContent = replies[n++ % replies.length];
      thread.scrollTop = thread.scrollHeight;
    });
    function addMsg(who, text) {
      const el = document.createElement('div');
      el.className = `msg ${who}`;
      el.textContent = text;
      thread.appendChild(el);
      thread.scrollTop = thread.scrollHeight;
      return el;
    }
  </script>
</body>
</html>
